# -----------------------------------------------------------------------
# DECODE SETTINGS — defaults work for most cases
# -----------------------------------------------------------------------

library_error_tolerance: 2
min_library_overlap: 8
revcomp: "YES"
demultiplexer_algorithm: "regex"
demultiplexer_mode: "single"
realign: "NO"
wiggle: "YES"

# -----------------------------------------------------------------------
# DELi SETUP — set once, do not change between runs
# -----------------------------------------------------------------------

chunk_size: 1000000
prefix: ""
debug: false
save_fastq_info: false
save_failed: false

# -----------------------------------------------------------------------
# POSTPROCESSING
# -----------------------------------------------------------------------

# smiles: optional SMILES lookup. Files must be gs:// URIs.
# smiles:
#   compound_col: compound
#   smiles_col: SMILES
#   files:
#     L01: gs://your-bucket/smiles/L01_enumerated.parquet

smiles: null

# on_duplicate_compound_id: what to do when the same compound_id appears more than once.
#   "fail" — abort with an error (default; catches unexpected duplicates)
#   "sum"  — merge duplicate rows by summing corrected_count and raw_count
on_duplicate_compound_id: "fail"

# labeling: list of labeling modes to apply (adds a label_{mode} boolean column).
#   null — no labeling (default)
#
# Available modes:
#   count               — corrected_count > 5
#   count_zscore        — corrected_count > 5 AND z_score > 1  (pre-supplied z-score only)
#   count_zscore_lib    — corrected_count > 5 AND (z_score_lib_normalized > 1 OR any disynthon > 1)
#   count_zscore_global — corrected_count > 5 AND (z_score_global_normalized > 1 OR any disynthon > 1)
#   count_polyo         — corrected_count > 5 AND (polyo > 4 OR any disynthon polyo > 1)
#
# labeling:
#   - count
#   - count_zscore_lib
#   - count_zscore_global
#   - count_polyo
labeling: null
