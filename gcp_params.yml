#   - gs://del_sickkids/data/WYB37322_20260807/SGCDEL_Camp1_PARP14A_P223843/SGCDEL_Camp1_PARP14A_P223843_S97_L008_R2_001.fastq.ora










# read_1:
#   - "gs://del_sickkids/data/WDR91_20260603_VernalisData_TCAGseq/NGS1_S25_L002_R1_001.fastq.ora"


# read_2:
#   - "gs://del_sickkids/data/WDR91_20260603_VernalisData_TCAGseq/NGS1_S25_L002_R2_001.fastq.ora"


# merged_fastq: pre-merged FASTQ — skips PREPROCESS (concat/fastp/fastqc) and
#         goes straight to decoding. Set instead of read_1/read_2/counts.
#         Recovery entry point: point it at a known-good FASTP_MERGE output
#         stranded in an old work dir, e.g.:
# merged_fastq: "gs://deliver-process/deliver-test-final/<tag>/work/0c/61cc95…/merged.fastq.gz"
merged_fastq: null

# out_dir: directory where all results will be written
out_dir: gs://deliver-process/temp-processed-files-updated_Aug25

# counts: pre-computed counts parquet — skips decoding, runs postprocessing only.
#         Set instead of read_1/read_2. See params.yml for full format documentation.
counts: null

# spot: use spot (preemptible) VMs for Cloud Batch tasks (default true, ~60-90%
#       cheaper). Set false — or pass --spot false to test_gcp.sh — for recovery
#       resumes with only a few long serial tasks left: avoids preemption churn,
#       and a first attempt rescued by a Nextflow retry is invisible to later
#       -resume (see docs/nextflow-resume-retry-cache-issue.md).
spot: true

# deli_data_dir: path inside the container image to the DELi data directory.
#   Not required when library_dict is set.
deli_data_dir: "/opt/deli_data/buildingblocks"

# library_dict: path to a pre-computed library_dict.json.
#   When set, BUILD_LIBRARY_DICT is skipped and deli_data_dir is not needed.
#   Useful in counts mode. Must be a gs:// URI.
library_dict: null

