# DELIVER pipeline parameters — GCP
#
# Usage:
#   nextflow run pipeline/main.nf -profile gcp -params-file gcp_params.yml [other-gcp-flags]
#
# GCP-specific: paths must be gs:// URIs; deli_data_dir is a path inside the container image.

# -----------------------------------------------------------------------
# INPUT — change for every run
# -----------------------------------------------------------------------

read_1:
  - "gs://aircheck-internal/DELIVER/raw_data_sample/2-WDR91_GAAGCAAGCG-TAGTCGGTGA_S2_L001_R1_001.1000000.fastq.gz"
  - "gs://aircheck-internal/DELIVER/raw_data_sample/2-WDR91_GAAGCAAGCG-TAGTCGGTGA_S2_L002_R1_001.1000000.fastq.gz"

read_2:
  - "gs://aircheck-internal/DELIVER/raw_data_sample/2-WDR91_GAAGCAAGCG-TAGTCGGTGA_S2_L002_R2_001.1000000.fastq.gz"
  - "gs://aircheck-internal/DELIVER/raw_data_sample/2-WDR91_GAAGCAAGCG-TAGTCGGTGA_S2_L001_R2_001.1000000.fastq.gz"

out_dir: "gs://deliver-process/temp-processed-files"

# counts: pre-computed counts parquet — skips decoding, runs postprocessing only.
#         Set instead of read_1/read_2. See params.yml for full format documentation.
counts: null

# deli_data_dir: path inside the container image to the DELi data directory.
#   Not required when library_dict is set.
deli_data_dir: "/opt/deli_data/buildingblocks"

# library_dict: path to a pre-computed library_dict.json.
#   When set, BUILD_LIBRARY_DICT is skipped and deli_data_dir is not needed.
#   Useful in counts mode. Must be a gs:// URI.
library_dict: null

