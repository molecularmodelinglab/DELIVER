# DELIVER pipeline parameters
# This is the only file you need to edit before running the pipeline.
#
# The pipeline detects the run mode automatically:
#   read_1 set → FASTQ input (preprocess → DELi → postprocessing)
#   counts set → counts.parquet input (postprocessing only)
#
# Usage:
#   sbatch submit.slurm --deliver-dir DIR --work-dir DIR --params-file FILE --log-dir DIR
#   Add --resume to resume after failure

# -----------------------------------------------------------------------
# INPUT — change for every run
# -----------------------------------------------------------------------

# read_1: sequencing file(s) for read 1 (one or more lanes, .fastq or .fastq.gz)
# read_2: sequencing file(s) for read 2 — paired-end only; omit or set null for single-end
#         Set read_1/read_2 OR counts, not both.
read_1:
  - "/path/to/sample_L001_R1.fastq.gz"
  - "/path/to/sample_L002_R1.fastq.gz"
read_2:
  - "/path/to/sample_L001_R2.fastq.gz"
  - "/path/to/sample_L002_R2.fastq.gz"

# out_dir: directory where all results will be written
out_dir: "/path/to/results"

# counts: pre-computed counts parquet — skips decoding entirely, runs postprocessing only.
#         Set instead of read_1/read_2.
#
# Required fields:
#   file:   path to the parquet file
#   format: "deli"     — raw DELi output (library_id, bb_ids, count, raw_count columns)
#           "external" — your own file; specify column names below
#
# Additional fields for format: "external"
# Compound identity — specify exactly ONE of:
#   (a) compound_col: column already in "library-bb1-bb2-bb3" format
#   (b) library_col + bb_ids_col: library ID column + comma-separated bb IDs column
#   (c) library_col + cycle_cols: library ID column + individual bb ID columns (in cycle order)
#
# counts:
#   file:   "/path/to/counts.parquet"
#   format: "deli"
#
# counts:
#   file:                "/path/to/counts.parquet"
#   format:              "external"
#   compound_col:        null   # (a) e.g. "compound_id"
#   num_cycles:          null   # (a) number of BB cycles; default 3. Set if your library name contains '-'
#   library_col:         null   # (b/c) e.g. "library_id"
#   bb_ids_col:          null   # (b) e.g. "bb_ids"
#   cycle_cols:          null   # (c) e.g. [A, B, C]
#   corrected_count_col: null   # required: UMI-corrected count column
#   raw_count_col:       null   # optional: raw read count (required for PolyO scores)
#   z_score_col:         null   # optional: pre-calculated z-score (carried through, not recalculated)
#   smiles_col:          null   # optional: SMILES column
counts: null

# deli_data_dir: path to the DELi data directory containing library definitions,
#                building block tables, etc. (see DELi docs for structure)
#                Not required when library_dict is set.
deli_data_dir: "/path/to/deli_data"

# library_dict: path to a pre-computed library_dict.json (built by build_library_dict.py).
#   When set, BUILD_LIBRARY_DICT is skipped and deli_data_dir is not needed.
#   Useful when running in counts mode on a machine without DELi data.
library_dict: null

# -----------------------------------------------------------------------
# SELECTION METADATA — written into the generated decode.yaml and used to
# name output files. Fill in for every run.
# -----------------------------------------------------------------------

# selection_id: short identifier for this selection experiment
#               (used as prefix for all output files)
selection_id: "my_selection"

# target_id: name of the target protein
target_id: "my_target"

# selection_condition: free-text description of selection conditions (e.g. "10nM", "-")
selection_condition: "-"

# date_ran: date the selection was run (YYYY-MM-DD)
date_ran: "2024-01-01"

# additional_info: any extra notes to store in the decode.yaml
additional_info: ""

# libraries: list of library IDs to decode against.
#            Must match library names in deli_data_dir.
libraries:
  - "L01"
  - "L02"

# -----------------------------------------------------------------------
# DECODE SETTINGS — defaults work for most cases; change only if needed
# -----------------------------------------------------------------------

# library_error_tolerance: max number of mismatches allowed when matching a library barcode
library_error_tolerance: 2

# min_library_overlap: minimum number of bases that must overlap between read and barcode
min_library_overlap: 8

# revcomp: whether to reverse-complement reads before decoding ("YES" / "NO")
revcomp: "YES"

# demultiplexer_algorithm: algorithm used to find barcode sections ("regex" or "cutadapt")
demultiplexer_algorithm: "regex"

# demultiplexer_mode: "single" (one library per read) or "library" (split by library tag)
demultiplexer_mode: "single"

# realign: whether to realign reads after initial barcode calling ("YES" / "NO")
realign: "NO"

# wiggle: allow 1-base wiggle room when locating barcode sections ("YES" / "NO")
wiggle: "YES"

# -----------------------------------------------------------------------
# DELi SETUP — set once after cloning, do not change between runs
# -----------------------------------------------------------------------

# chunk_size: number of reads per FASTQ chunk sent to each decode job
chunk_size: 1000000

# prefix: output file prefix — defaults to selection_id if empty
prefix: ""

# debug: enable DELi debug logging
debug: false

# save_fastq_info: include fastq_file and read_name columns in decoded output (published to out_dir/debug/decoded/)
save_fastq_info: false

# save_failed: save failed decoding results per chunk to out_dir/debug/failed/
save_failed: false

# config_file: optional path to a custom DELi config file
# config_file: null

# ORA inputs: .fastq.ora files (Illumina DRAGEN ORA) are decompressed
# automatically in CONCAT via `orad` (must be on PATH: module-load on Longleaf,
# or build the container with --build-arg ORAD_URL=...). Standard reference-free
# FASTQ ORA needs no reference; set ora_reference only for reference-based ORA.
# ora_reference: /path/to/oradata


# smiles: optional SMILES lookup configuration.
# If provided, SMILES are added to each compound after normalization and
# carried through to singletons.parquet. Disynthons are not affected.
# compound_col - column name for compound ID in your SMILES files
# smiles_col   - column name for SMILES in your SMILES files
# files        - mapping of library_id to sorted enumerated parquet file
# smiles:
#   compound_col: compound
#   smiles_col: SMILES
#   files:
#     L01: /path/to/L01_enumerated.parquet
#     L04: /path/to/L04_enumerated.parquet
smiles: null

# on_duplicate_compound_id: what to do when the same compound_id appears more than once.
#   "fail" — abort with an error listing the offending IDs (default; alerts you to unexpected duplicates)
#   "sum"  — merge duplicate rows by summing corrected_count and raw_count
#            If a SMILES column is present, all duplicate rows must have the same SMILES — fails otherwise.
on_duplicate_compound_id: "fail"

# labeling: list of labeling modes to apply to the enriched table (adds a label_{mode} boolean column).
#   null — no labeling (default)
#
# Available modes:
#   count               — corrected_count > 5
#   count_zscore_lib    — corrected_count > 5 AND (z_score_lib_normalized > 1 OR any disynthon z_score_lib_normalized > 1)
#   count_zscore_global — corrected_count > 5 AND (z_score_global_normalized > 1 OR any disynthon z_score_global_normalized > 1)
#   count_polyo         — corrected_count > 5 AND (polyo > 4 OR any disynthon polyo > 1)
#
# Output: labeled.parquet (with label_* columns added to enriched table).
#         labeled_duplicates.parquet — same rows as labeled.parquet but filtered to duplicate SMILES,
#         sorted by SMILES (only written if SMILES column is present and duplicates exist).
#
# labeling:
#   - count
#   - count_zscore_lib
#   - count_zscore_global
#   - count_polyo
labeling: null
